name: run-tests

on: [push, pull_request]

jobs:
    test:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest]
                php: [8.5, 8.4, 8.3]
                laravel: [13.*, 12.*]
                stability: [prefer-stable]
                database: [testing]
                include:
                    -   laravel: 13.*
                        testbench: 11.*
                        pest: 4.*
                    -   laravel: 12.*
                        testbench: 10.*
                        pest: 4.*
                    -   php: 8.4
                        laravel: 13.*
                        pest: 5.*
                    -   php: 8.5
                        laravel: 13.*
                        pest: 5.*
                    -   os: ubuntu-latest
                        php: 8.5
                        laravel: 13.*
                        testbench: 11.*
                        pest: 5.*
                        stability: prefer-stable
                        database: mysql
                    -   os: ubuntu-latest
                        php: 8.5
                        laravel: 13.*
                        testbench: 11.*
                        pest: 5.*
                        stability: prefer-stable
                        database: pgsql

        name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - Pest ${{ matrix.pest }} - ${{ matrix.database }}

        services:
            mysql:
                image: ${{ matrix.database == 'mysql' && 'mysql:8.4' || '' }}
                env:
                    MYSQL_DATABASE: translatable
                    MYSQL_ROOT_PASSWORD: password
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping -ppassword" --health-interval=10s --health-timeout=5s --health-retries=10
            postgres:
                image: ${{ matrix.database == 'pgsql' && 'postgres:18' || '' }}
                env:
                    POSTGRES_DB: translatable
                    POSTGRES_USER: root
                    POSTGRES_PASSWORD: password
                ports:
                    - 5432:5432
                options: --health-cmd="pg_isready -U root -d translatable" --health-interval=10s --health-timeout=5s --health-retries=10

        env:
            DB_CONNECTION: ${{ matrix.database }}
            DB_HOST: 127.0.0.1
            DB_DATABASE: translatable
            DB_USERNAME: root
            DB_PASSWORD: password

        steps:
            -   name: Checkout code
                uses: actions/checkout@v7

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo_sqlite, pdo_mysql, pdo_pgsql, bcmath, soap, intl, gd, exif, iconv
                    coverage: none

            -   name: Install dependencies
                run: |
                    composer require --dev "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" --no-update --no-interaction
                    composer require "laravel/framework:${{ matrix.laravel }}" --no-update --no-interaction
                    composer update --${{ matrix.stability }} --prefer-dist --no-interaction

            -   name: Execute tests
                run: vendor/bin/pest
